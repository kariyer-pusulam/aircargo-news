name: Air Cargo News Alerts

on:
  schedule:
    - cron: "*/10 * * * *"   # her 10 dakikada bir (GitHub yogunlukta birkac dk gecikebilir)
  workflow_dispatch:          # elle calistirma butonu

permissions:
  contents: write             # seen.json'u repoya geri kaydetmek icin

concurrency:
  group: aircargo-news
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check feeds and send messages
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PHONE_ID: ${{ secrets.META_PHONE_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WA_PROVIDER: ${{ secrets.WA_PROVIDER }}
          WA_PHONE: ${{ secrets.WA_PHONE }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          GREENAPI_ID: ${{ secrets.GREENAPI_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
        run: python monitor.py

      - name: Save state
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen news" && git push)
